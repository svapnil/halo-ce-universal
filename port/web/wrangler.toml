# The browser build (ninja web) on Cloudflare Workers; see README.md. In this
# folder, `npm run dev` serves it on localhost, `npm run deploy` publishes it.
# Paths are relative to this file.

name = "halo-web"
main = "worker/worker.js"
compatibility_date = "2026-09-01"

# the site's addresses; the worker also answers on halo-web.<account>.workers.dev
routes = [
	{ pattern = "openhaloce.com", custom_domain = true },
	{ pattern = "www.openhaloce.com", custom_domain = true },
]
workers_dev = true

# halo.js and halo.wasm, as `ninja web` writes them, and the page, as
# `npm run build` writes it (ninja web's .assetsignore leaves out the object
# files). The worker answers every request
# first, so that every response gets the cross-origin isolation headers.
[assets]
directory = "../../build/web"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# The game's maps, at maps/<name>.map (npm run upload-maps). They are too large
# for static assets, whose files are limited to 25 MiB.
[[r2_buckets]]
binding = "MAPS"
bucket_name = "open-halo-ce"

[dev]
port = 8765

# Network play's signalling (worker/rooms.js, NETWORK.md): one GameRoom for
# each hosted game. Its Realtime SFU app is in two secrets, REALTIME_APP_ID
# and REALTIME_APP_TOKEN: `npx wrangler secret put` for Cloudflare, and
# .dev.vars (which git ignores) for `npm run dev`.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Each room opens Realtime SFU sessions, on this account's bill: an address
# makes at most 5 rooms and 20 joins a minute (worker/rooms.js). The ids are
# this account's names for the two limits.
[[ratelimits]]
name = "HOST_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Native games (NETWORK.md): the relay (port/web/relay, on Fly.io), and the
# tokens for it that worker/relay.js gives the site's pages, signed with the
# secret RELAY_TOKEN_SECRET (`npx wrangler secret put`; .dev.vars for `npm
# run dev`), which the relay has too. An address gets at most 10 a minute
# (a page asks once per connection to the relay).
[vars]
RELAY_URL = "wss://halo-web-relay.fly.dev/"

[[ratelimits]]
name = "RELAY_LIMIT"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
